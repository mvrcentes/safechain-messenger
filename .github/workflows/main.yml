name: SonarQube Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube-analysis:
    # Use a macOS self-hosted runner.
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan (Docker)
        id: sonar_scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # en tu VM: http://localhost:9000
          SONAR_TOKEN:     ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          docker pull sonarsource/sonar-scanner-cli:latest
          docker run --rm --network host \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_LOGIN="$SONAR_TOKEN" \
            -v "$(pwd):/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey=CI-CD-githubactions \
            -Dsonar.projectName=CI-CD-githubactions \
            -Dsonar.sources=. \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/.git/**" \
            -Dsonar.verbose=true

      - name: SonarQube Quality Gate check
        if: ${{ steps.sonar_scan.outcome == 'success' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
