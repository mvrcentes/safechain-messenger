name: SonarQube Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube-analysis:
    # Use a macOS self-hosted runner.
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for SonarQube to be ready
        run: |
          echo "Waiting for SonarQube to be ready..."
          for i in {1..30}; do
            status=$(curl -s http://localhost:9000/api/system/status | jq -r '.status' || echo "DOWN")
            echo "Status: $status"
            if [ "$status" = "UP" ]; then
              echo "SonarQube is ready!"
              break
            fi
            sleep 10
          done
      - name: SonarQube Scan (Docker)
        id: sonar_scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # en tu VM: http://localhost:9000
          SONAR_TOKEN:     ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          docker pull sonarsource/sonar-scanner-cli:latest
          docker run --rm --network host \
            -w /usr/src \
            --user $(id -u):$(id -g) \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "$(pwd):/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey=CI-CD-githubactions \
            -Dsonar.projectName=CI-CD-githubactions \
            -Dsonar.sources=. \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/.git/**,frontend/src/components/ui/**" \
            -Dsonar.verbose=true
      - name: Debug report-task
        run: |
          echo "Listing .scannerwork:"
          ls -la .scannerwork || true
          echo "Show report-task.txt if present:"
          test -f .scannerwork/report-task.txt && cat .scannerwork/report-task.txt || echo "report-task.txt not found"
      - name: SonarQube Quality Gate check
        if: ${{ steps.sonar_scan.outcome == 'success' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
