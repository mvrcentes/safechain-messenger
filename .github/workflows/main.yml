name: SonarQube Analysis

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube-analysis:
    # Use a macOS self-hosted runner.
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # (Opcional) Instala toolchain si aplica: Node/Java/etc.
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'

      - name: Install SonarScanner CLI (macOS)
        run: |
          brew install sonar-scanner || true
          echo "SONAR_SCANNER_BIN=$(brew --prefix)/opt/sonar-scanner/bin/sonar-scanner" >> $GITHUB_ENV

      - name: SonarQube Scan (CLI)
        id: sonar_scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "$SONAR_SCANNER_BIN" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.projectKey=CI-CD-githubactions \
            -Dsonar.projectName=CI-CD-githubactions \
            -Dsonar.sources=. \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/.git/**" \
            -Dsonar.verbose=true

      - name: SonarQube Quality Gate check
        if: ${{ always() }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
