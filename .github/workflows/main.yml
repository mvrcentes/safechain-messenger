name: SonarQube Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sonarqube-analysis:
    # Self-hosted Linux runner; SonarQube is pre-running on the same VM.
    runs-on: [self-hosted, linux]
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # e.g. http://localhost:9000
      SONAR_TOKEN:     ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure jq is available (for status check)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found; attempting install..."
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y jq
            else
              echo "Error: jq is required for the readiness check and could not be installed automatically." >&2
              exit 1
            fi
          fi

      - name: Wait for SonarQube to be ready (fails if not UP)
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for SonarQube to be ready at: ${SONAR_HOST_URL}"
          attempts=0
          max_attempts=30
          until [ $attempts -ge $max_attempts ]
          do
            status="$(curl -fsS --max-time 3 "${SONAR_HOST_URL}/api/system/status" | jq -r '.status' || echo DOWN)"
            echo "Attempt $((attempts+1))/${max_attempts} -> status: ${status}"
            if [ "${status}" = "UP" ]; then
              echo "SonarQube is ready."
              break
            fi
            attempts=$((attempts+1))
            sleep 10
          done
          if [ "${status}" != "UP" ]; then
            echo "SonarQube did not become ready in time. Failing the job." >&2
            exit 78
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (frontend/backend) without running lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail

          install_node_deps() {
            local dir="$1"
            echo "Installing dependencies in: $dir"
            cd "$dir"

            # Prefer package manager by detected lockfile
            if [ -f pnpm-lock.yaml ]; then
              echo "Detected pnpm-lock.yaml"
              corepack enable || true
              corepack prepare pnpm@latest --activate || true
              # Try strict first, then relax if lock is inconsistent
              pnpm install --frozen-lockfile --ignore-scripts || pnpm install --ignore-scripts

            elif [ -f yarn.lock ]; then
              echo "Detected yarn.lock"
              corepack enable || true
              corepack prepare yarn@stable --activate || true
              yarn install --ignore-scripts --frozen-lockfile || yarn install --ignore-scripts

            elif [ -f package-lock.json ]; then
              echo "Detected package-lock.json (npm)"
              # Try deterministic install; if lock is out-of-sync, fall back to npm install
              npm ci --ignore-scripts || npm install --ignore-scripts

            elif [ -f package.json ]; then
              echo "No lockfile found; using npm install"
              npm install --ignore-scripts

            else
              echo "No package.json in $dir; skipping"
            fi

            cd - >/dev/null
          }

          # Frontend
          if [ -d frontend ]; then
            install_node_deps frontend
          fi

          # Backend
          if [ -d backend ]; then
            install_node_deps backend
          fi

      - name: Cache dependency-check DB
        uses: actions/cache@v4
        with:
          path: odc-data
          key: odc-db-${{ runner.os }}-${{ github.workflow }}-${{ github.ref_name }}
          restore-keys: |
            odc-db-${{ runner.os }}-${{ github.workflow }}-
            odc-db-${{ runner.os }}-
            odc-db-

      - name: OWASP Dependency-Check (Docker)
        shell: bash
        run: |
          set -euo pipefail
          # Prepare cache (NVD DB) and output directories
          mkdir -p odc-data dependency-report

          # Build scan target list based on folders that actually exist in the repo
          SCAN_ARGS=()
          [ -d frontend ] && SCAN_ARGS+=(/src/frontend)
          [ -d backend ] && SCAN_ARGS+=(/src/backend)

          if [ ${#SCAN_ARGS[@]} -eq 0 ]; then
            echo "No scanable directories found (expected 'frontend' and/or 'backend')." >&2
            exit 1
          fi

          echo "Dependency-Check will scan: ${SCAN_ARGS[@]}"

          IMAGE_TAG=owasp/dependency-check:10.0.2
          # Pull specific stable image tag to avoid regressions
          docker image inspect "$IMAGE_TAG" >/dev/null 2>&1 || docker pull "$IMAGE_TAG"

          # ---- Pre-warm the NVD DB (update-only) with retries ----
          prewarm_rc=0
          for attempt in 1 2 3; do
            echo "[ODC][prewarm] Attempt ${attempt}/3"
            set +e
            docker run --rm \
              -v "$(pwd)/odc-data:/usr/share/dependency-check/data" \
              -e NVD_API_KEY="${{ secrets.NVD_API_KEY }}" \
              "$IMAGE_TAG" \
              --updateonly \
              --nvdApiDelay 6000 \
              --nvdApiKey "${{ secrets.NVD_API_KEY }}"
            prewarm_rc=$?
            set -e
            if [ $prewarm_rc -eq 0 ]; then
              echo "[ODC][prewarm] Completed successfully"
              break
            fi
            echo "[ODC][prewarm] Attempt ${attempt} failed with rc=$prewarm_rc. Sleeping 20s before retry..."
            sleep 20
          done

          # ---- Run full scan (online) with log + retries ----
          run_odc() {
            docker run --rm \
              -v "$(pwd):/src" \
              -v "$(pwd)/odc-data:/usr/share/dependency-check/data" \
              -v "$(pwd)/dependency-report:/report" \
              -e NVD_API_KEY="${{ secrets.NVD_API_KEY }}" \
              "$IMAGE_TAG" \
              --scan ${SCAN_ARGS[@]} \
              --format XML \
              --project "SafeChainMessenger" \
              --out /report \
              --log /report/odc.log \
              --failOnCVSS 11 \
              --disableNodeAudit \
              --nvdApiDelay 6000 \
              --nvdApiKey "${{ secrets.NVD_API_KEY }}"
          }

          set +e
          rc=0
          for attempt in 1 2 3; do
            echo "[ODC] Attempt ${attempt}/3"
            run_odc
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "[ODC] Completed successfully"
              break
            fi
            echo "[ODC] Attempt ${attempt} failed with rc=$rc. Sleeping 20s before retry..."
            sleep 20
          done

          if [ $rc -ne 0 ]; then
            echo "[ODC] Online scan failed after retries. Log tail:"; tail -n 200 dependency-report/odc.log || true
            # Only attempt offline if cache has content
            if [ -z "$(find odc-data -type f -print -quit)" ]; then
              echo "[ODC] Cache is empty; cannot run offline. Failing." >&2
              exit $rc
            fi
            echo "[ODC] Running offline with cached DB..."
            docker run --rm \
              -v "$(pwd):/src" \
              -v "$(pwd)/odc-data:/usr/share/dependency-check/data" \
              -v "$(pwd)/dependency-report:/report" \
              -e NVD_API_KEY="${{ secrets.NVD_API_KEY }}" \
              "$IMAGE_TAG" \
              --scan ${SCAN_ARGS[@]} \
              --format XML \
              --project "SafeChainMessenger" \
              --out /report \
              --log /report/odc.log \
              --failOnCVSS 11 \
              --disableNodeAudit \
              --nvdApiDelay 6000 \
              --noupdate
            rc=$?
          fi
          set -e

          if [ $rc -ne 0 ]; then
            echo "[ODC] Failed to produce report (even offline). Exiting." >&2
            exit $rc
          fi

          echo "[ODC] Report generated at dependency-report/dependency-check-report.xml"

      - name: (Optional) NVD connectivity diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          echo "Testing NVD endpoints (no secret):"
          curl -sS -w "\nHTTP:%{http_code}\n" "https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=1" | sed -e 's/{.*}//'
          echo "Testing NVD endpoints (with apiKey present):"
          if [ -n "${{ secrets.NVD_API_KEY }}" ]; then
            curl -sS -w "\nHTTP:%{http_code}\n" "https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=1&apiKey=${{ secrets.NVD_API_KEY }}" | sed -e 's/{.*}//'
          else
            echo "NVD_API_KEY secret not set"
          fi

      - name: SonarQube Scan (Docker client only; does NOT start SonarQube)
        id: sonar_scan
        shell: bash
        run: |
          set -euo pipefail
          # Ensure the scanner writes metadata into the repo workspace
          rm -rf .scannerwork || true
          mkdir -p .scannerwork

          # Pull scanner if not present (does NOT run SonarQube server)
          if ! docker image inspect sonarsource/sonar-scanner-cli:latest >/dev/null 2>&1; then
            docker pull sonarsource/sonar-scanner-cli:latest
          fi

          # Use host networking so the scanner can reach localhost:9000 on the runner
          docker run --rm --network host \
            -w /usr/src \
            --user "$(id -u):$(id -g)" \
            -e SONAR_HOST_URL="${SONAR_HOST_URL}" \
            -e SONAR_TOKEN="${SONAR_TOKEN}" \
            -v "$(pwd):/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey="${{ github.repository_owner }}_${{ github.event.repository.name }}" \
            -Dsonar.projectName="${{ github.event.repository.name }}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.sources=. \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/.git/**,frontend/src/components/ui/**" \
            -Dsonar.working.directory=/usr/src/.scannerwork \
            -Dsonar.dependencyCheck.reportPath=/usr/src/dependency-report/dependency-check-report.xml \
            -Dsonar.dependencyCheck.htmlReportPath=/usr/src/dependency-report/dependency-check-report.html \
            -Dsonar.verbose=true

      - name: Debug report-task
        shell: bash
        run: |
          echo "Listing .scannerwork:"
          ls -la .scannerwork || true
          echo "Show report-task.txt if present:"
          test -f .scannerwork/report-task.txt && cat .scannerwork/report-task.txt || echo "report-task.txt not found"

      - name: SonarQube Quality Gate check
        if: ${{ steps.sonar_scan.outcome == 'success' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
